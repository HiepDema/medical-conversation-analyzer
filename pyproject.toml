[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-conversation-analyzer"
version = "0.1.0"
description = "Vietnamese medical conversation analyzer: ASR + speaker diarization (ICA) + LLM classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "noisereduce>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
medical-analyzer = "medical_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
